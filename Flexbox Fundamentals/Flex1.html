<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { 
            margin: 0;
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            font-family: Arial, sans-serif;
            padding: 1rem;
            line-height: 1.5;
        }
        .flex-container{
            display: flex;
            background: #eef;
            justify-content: space-between;
            flex-direction: row;
            align-items:baseline;
            padding: 1rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .flex-item{
            flex: 1 1 150px;
            background: #cce5ff;
            padding: 1rem;
            text-align: center;
            border: 1px solid #99c;
            border-radius: 4px;
        }
        h2{
            margin-bottom: .5rem;
        }
    </style>
</head>
<body>
    <h1>CSS <code> display: flex </code>Demo</h1>
    <section>
        <h2>Responsive Flex Container</h2>
        <div class="flex-container">
            <div class="flex-item">Item 1</div>
            <div class="flex-item">Item 2</div>
            <div class="flex-item">Item 3</div>
            <div class="flex-item">Item 4</div>
            <div class="flex-item">Item 5</div>
            <div class="flex-item">Item 6</div>
        </div>
    </section>
    <p>Each item has a base width of 150px, flexibly grows and shrinks, wraps to new lines on narrow screens.</p>
</body>
</html>
