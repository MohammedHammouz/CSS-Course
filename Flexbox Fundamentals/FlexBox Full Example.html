<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Fundamentals: Full Example with Comments</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial,sans-serif;
            line-height: 1.5;
            color: #333;
        }
        a{
            text-decoration: none;
            color: inherit;
        }
         nav,section,footer{
            padding: 1rem;
        }
        
       
        .nav-bar{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #004466;
        }
        
        .nav-bar a{
            color: white;
            margin: 0 1rem;
            padding: 0.5rem;
        }
        .nav-bar a:hover{
            background: #006688;
            border-radius: 4px;
        }
       
        .gallery{
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .gallery-item{
            flex: 1 1 calc(33% - 1rem);
            background: #e0e0e0;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.25rem;
            color: #555;
        }
        .site-footer {
            display: flex;
            justify-content: space-between;   /* spread columns */
            background: #333;
            color: white;
        }
        .footer-col {
            flex: 1;                           /* each column shares available space */
            padding: 0 1rem;                  /* horizontal padding */
        }
        .footer-col h3 {
            margin-bottom: 0.5rem;
        }
        .footer-col p, .footer-col ul {
            margin-bottom: 0.5rem;
        }
        .footer-col ul {
            list-style: none;                 /* remove bullets */
        }
        .footer-col li {
            margin-bottom: 0.25rem;
        }

        @media (max-width: 800px){
            .gallery-item{
                flex: 1 1 calc(50% - 1rem);
            }
            .site-footer {
                flex-direction: column;         /* vertical stack */
                text-align: center;             /* center text */
            }
            .footer-col {
                padding: 1rem 0;                /* vertical padding */
            }
        }
        @media (max-width: 500px){
            .gallery-item{
                flex: 1 1 calc(100% - 1rem);
            }
            .site-footer {
                flex-direction: column;         /* vertical stack */
                text-align: center;             /* center text */
            }
            .footer-col {
                padding: 1rem 0;                /* vertical padding */
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>
    <section>
        <h2>Responsive Flexbox Gallery</h2>
        <div class="gallery">
            <div class="gallery-item">Item 1</div>
            <div class="gallery-item">Item 2</div>
            <div class="gallery-item">Item 3</div>
            <div class="gallery-item">Item 4</div>
            <div class="gallery-item">Item 5</div>
            <div class="gallery-item">Item 6</div>
            <div class="gallery-item">Item 7</div>
            <div class="gallery-item">Item 8</div>
            <div class="gallery-item">Item 9</div>
        </div>
    </section>
    <footer class="site-footer">
    <div class="footer-col">
      <h3>About Us</h3>
      <p>We build responsive layouts using Flexbox.</p>
    </div>
    <div class="footer-col">
      <h3>Quick Links</h3>
      <ul>
        <li><a href="#">Privacy Policy</a></li>
        <li><a href="#">Terms of Service</a></li>
        <li><a href="#">FAQ</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h3>Contact</h3>
      <p>Email: info@example.com</p>
      <p>Phone: +123 456 7890</p>
    </div>
  </footer>
</body>
</html>
