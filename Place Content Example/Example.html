<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,html{
            height: 100%;
            margin: 0;
        }
        .container{
            display: grid;
            background: #f9f9f9;
            grid-template-columns: repeat(2,100px);
            grid-template-rows: repeat(2,100px);
            width: 400px;
            height: 400px;
            border: 2px dashed #666;
            place-content: center;
            margin: auto;
            gap: 10px;
        }
        .Box{
            background: #4a90e2;
            align-items: center;
            justify-content: center;
            display: flex;
            color: #fff;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class ="Box">A</div>
        <div class ="Box">B</div>
        <div class ="Box">C</div>
        <div class ="Box">D</div>
    </div>
</body>
</html>
