<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html { font-size: 16px; }      /* 1rem = 16px */
        h2   { font-size: 2rem; }      /* 32px */
        p    { font-size: .75rem; }  /* 12px [75% of 16px] */
    </style>
</head>
<body>
    <h2>Heading at 2rem (32px)</h2>
    <p>Paragraph at 0.75rem (12px).</p>
</body>
</html>
