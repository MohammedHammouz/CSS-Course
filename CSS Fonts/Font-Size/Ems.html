<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
            body { font-size: 16px; }      /* 1em = 16px */
            .parent { font-size: 1.5em; }  /* 24px */
            .child  { font-size: 1em; }    /* 24px, inherits parent */
        </style>
</head>
<body>
    <div class="parent">
        Parent text: 1.5em (24px)
        <div class="child">
        Child text: 1em of parent (24px)
        </div>
  </div>
</body>
</html>
