<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .center{
            background: #f0f0f0;
            display: grid;
            place-items: center;
            height: 100%;
        }
        .box{
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem 3rem;
            background: #4a90e2;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="center">
        <div class="box">
            I’m perfectly centered! 🎯
        </div>
    </div>
    
</body>
</html>
