<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size in pt</title>
    <style>
        .body-text{
            font-size: 12pt;
        }
        .heading{
            font-size: 18pt;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1 class="heading">18pt Heading</h1>
  <p class="body-text">
    This paragraph is set in 12pt, matching common print typography standards.
  </p>
</body>
</html>
