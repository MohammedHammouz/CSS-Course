<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Margin Example</title>
    <style>
        .box{
            background-color:  #f0f8ff;
            border: 2px solid #ccc;
            margin :20px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        This div has a 20px margin on all sides.
    </div>
</body>
</html>
