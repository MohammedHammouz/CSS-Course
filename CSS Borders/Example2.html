<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dashed-border{
            border: 3px dashed green;
            padding: 10px;
            margin: 20px;
        }
        .dotted-border{
            border: 4px dotted blue;
            padding: 10px;
            margin: 20px;
        }
        .double-border{
            border: 5px double  purple;
            padding: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>
     <div class="dashed-border">This div has a 3px dashed green border.</div>
    <div class="dotted-border">This div has a 4px dotted blue border.</div>
    <div class="double-border">This div has a 5px double purple border.</div>
</body>
</html>
