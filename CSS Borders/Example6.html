<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid #3498db;
            padding: 20px;
            margin: 20px;
            border-radius: 10px; /* Rounded corners */
            background-color: #f0f8ff;
        }
        p{
            border : 3px dashed #e74c3c;
            padding: 20px;
            margin: 20px;
        }
        button{
            border: 2px dotted green;
            padding: 10px 20px;
            margin: 20px;
            background-color: #fff;
            color: #333;
            border-radius: 5px; /* Slightly rounded corners */
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>CSS Borders Practice Activity</h1>
    <div class="box">
        This div uses the shorthand border property with a solid blue border and rounded corners.
    </div>
    <p>
    This paragraph demonstrates using individual border properties (width, style, and color) to create a dashed red border.
    </p>
        <button >Click me</button>
</body>
</html>
